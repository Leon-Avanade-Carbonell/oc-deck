<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Top-down plane silhouette, nose pointing up (north). White so DeckGL getColor tinting works. -->
  <!-- Fuselage -->

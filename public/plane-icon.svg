  <!-- Main wings -->
  <polygon points="32,30 4,46 4,50 32,40 60,50 60,46" fill="white"/>
  <!-- Tail fins -->
  <polygon points="32,48 20,56 20,58 32,54 44,58 44,56" fill="white"/>
</svg>
